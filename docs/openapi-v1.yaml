openapi: 3.0.3
info:
  title: Immortal Flyswarm API
  version: "1.0.0"
  description: |
    Session / Replay + P1 LLM boundary for the paper trading pit.
    Success payloads reuse existing iff.* shapes (pitView, worldView, iff.explain/1).
    Errors use RFC 9457 application/problem+json.
    Write and LLM routes require Authorization: Bearer <ownerToken> from POST /v1/sessions.
servers:
  - url: http://127.0.0.1:8787
  - url: /
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /ready:
    get:
      summary: Readiness (graph, store, llm)
      responses:
        "200":
          description: Ready
        "503":
          description: Degraded
  /v1/sessions:
    post:
      summary: Create paper pit session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seed:
                  type: integer
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  ownerToken:
                    type: string
                  genesisId:
                    type: string
                  view:
                    $ref: "#/components/schemas/SessionView"
  /v1/sessions/{id}:
    get:
      summary: Current pit + world view
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: View
  /v1/sessions/{id}/tick:
    post:
      summary: Advance one tick (client-driven clock)
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      security:
        - ownerToken: []
      responses:
        "200":
          description: Updated view
  /v1/sessions/{id}/stimulus:
    post:
      summary: Queue sense pulse (food|threat|light|dark)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      security:
        - ownerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [food, threat, light, dark]
                intensity:
                  type: number
      responses:
        "200":
          description: Updated view
        "409":
          description: Stimulus cooldown
  /v1/sessions/{id}/settle:
    post:
      summary: Immediate cull / spawn settle
      parameters:
        - $ref: "#/components/parameters/SessionId"
      security:
        - ownerToken: []
      responses:
        "200":
          description: Updated view
  /v1/sessions/{id}/running:
    patch:
      summary: Pause flag only (no server auto-tick)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      security:
        - ownerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [running]
              properties:
                running:
                  type: boolean
      responses:
        "200":
          description: Flag updated
  /v1/sessions/{id}/archive:
    get:
      summary: Full colony archive (iff.colony-archive/1)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      security:
        - ownerToken: []
      responses:
        "200":
          description: Archive bundle
  /v1/sessions/{id}/restore:
    post:
      summary: Restore from colony archive
      parameters:
        - $ref: "#/components/parameters/SessionId"
      security:
        - ownerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                archive:
                  type: object
      responses:
        "200":
          description: Restored view
  /v1/sessions/{id}/prove:
    post:
      summary: Replay prove for member BrainSessions + world hash
      parameters:
        - $ref: "#/components/parameters/SessionId"
      security:
        - ownerToken: []
      responses:
        "200":
          description: Proof
  /v1/sessions/{id}/events:
    get:
      summary: Paginated world events
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: from
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Event page
  /v1/sessions/{id}/branches:
    post:
      summary: Personal experiment branch (no extra vote weight)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      security:
        - ownerToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                eventId:
                  type: string
      responses:
        "200":
          description: Branch id
  /v1/branches/{id}:
    get:
      summary: Branch snapshot / causal chain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch record
  /v1/sessions/{id}/world:
    get:
      summary: P2 paper-world layers (colony/intent/risk/execution + baseline)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: iff.paper-layers/1
  /v1/sessions/{id}/layers/{layer}:
    get:
      summary: Single P2 layer
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: layer
          in: path
          required: true
          schema:
            type: string
            enum: [colony, intent, risk, execution, market, baseline]
      responses:
        "200":
          description: Layer slice
  /v1/sessions/{id}/market:
    post:
      summary: Queue a read-only market observation for the next tick
      parameters:
        - $ref: "#/components/parameters/SessionId"
      security:
        - ownerToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  properties:
                    changeBps:
                      type: integer
                    activity:
                      type: integer
                provenance:
                  type: object
      responses:
        "200":
          description: Queued
        "400":
          description: Forbidden fields or bad provenance
  /v1/souls/{soulId}:
    get:
      summary: Soul roster summary
      parameters:
        - name: soulId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Soul summary
  /v1/llm/explain:
    post:
      summary: Explain fly behavior (LLM or degraded local)
      security:
        - ownerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, flyId]
              properties:
                sessionId:
                  type: string
                flyId:
                  type: integer
                locale:
                  type: string
      responses:
        "200":
          description: iff.explain/1
  /v1/llm/ask:
    post:
      summary: Catalog ask or free-text (degrades without LLM)
      security:
        - ownerToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                questionId:
                  type: string
                text:
                  type: string
                locale:
                  type: string
      responses:
        "200":
          description: iff.ask/1
  /v1/llm/plan:
    post:
      summary: Candidate plans + validatePlans (never executes)
      security:
        - ownerToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
      responses:
        "200":
          description: iff.plan-bundle/1
  /v1/llm/validate:
    post:
      summary: Validate submitted plans only
      security:
        - ownerToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, plans]
              properties:
                sessionId:
                  type: string
                plans:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Validated plans
components:
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    SessionView:
      type: object
      properties:
        pit:
          type: object
          description: pitView() shape
        world:
          type: object
          description: worldView() shape
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        request_id:
          type: string
